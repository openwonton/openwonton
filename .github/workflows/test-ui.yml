name: test-ui
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".changelog/**"
      - ".tours/**"
      - "contributing/**"
      - "demo/**"
      - "dev/**"
      - "e2e/**"
      - "integrations/**"
      - "pkg/**"
      - "scripts/**"
      - "terraform/**"
      - "website/**"
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".changelog/**"
      - ".tours/**"
      - "contributing/**"
      - "demo/**"
      - "dev/**"
      - "e2e/**"
      - "integrations/**"
      - "pkg/**"
      - "scripts/**"
      - "terraform/**"
      - "website/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - uses: ./.github/actions/setup-js
        with:
          node-version: "18"
      - name: lint:js
        run: yarn run lint:js
      - name: lint:hbs
        run: yarn run lint:hbs

  tests:
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
        split: [4]
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - uses: ./.github/actions/setup-js
        with:
          node-version: "18"
      - uses: browser-actions/setup-chrome@c485fa3bab6be59dce18dbc18ef6ab7cbc8ff5f1 # v1.2.0
      - name: ember exam
        env:
          PERCY_ENABLE: "0"
        run: yarn ember exam --split=${{ matrix.split }} --partition=${{ matrix.partition }}

permissions:
  contents: read
